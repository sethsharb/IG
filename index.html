<!doctype html>
<meta charset="utf-8">
<title>Instagram Grid (image + handle)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --gap:16px; }
  body{
    margin:24px;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:#fafafa; color:#222;
  }
  .topbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .muted{ color:#666 }
  /* Masonry using CSS Grid with JS-calculated row spans (stable order) */
  .masonry{
    display:grid;
    grid-template-columns: repeat(4, 1fr); /* 4 columns on widest */
    gap: var(--gap);
    align-items:start; /* prevent stretch */
  }
  /* 3 columns on medium screens */
  @media (max-width: 1100px){
    .masonry{ grid-template-columns: repeat(3, 1fr); }
  }
  /* 2 columns on small/mobile screens */
  @media (max-width: 700px){
    .masonry{ grid-template-columns: repeat(2, 1fr); }
  }
  .card{ break-inside:avoid; margin:0 0; background:#fff; border:1px solid #eee; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04); }

  /* The thumbnail is an Instagram embed with its header/footer clipped away,
     so only the photo itself shows. The iframe is rendered at EMBED_W (the
     narrowest width Instagram's embed lays out cleanly) and scaled down to
     the tile width. */
  .thumb{ display:block; position:relative; overflow:hidden; background:#eee; }
  .thumb iframe{
    position:absolute; top:0; left:0; border:0;
    transform-origin:0 0;
    pointer-events:none; /* clicks go to the overlay link instead */
  }
  /* Transparent click target so the whole photo still opens the post. */
  .thumb .hit{ position:absolute; inset:0; z-index:1; }

  .meta{ padding:8px 10px; font-size:14px; color:#555; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .meta a{ color:inherit; text-decoration:none; }
  .meta a:hover{ text-decoration:underline; }
  .count{ font-size:13px; color:#777; }
  .controls{ display:flex; align-items:center; gap:12px; }
  input[type="range"]{ width:180px; }
  .warn{ color:#b45; font-size:12px; }
  .loader{ display:none; align-items:center; justify-content:center; gap:8px; padding:24px 0; color:#888; font-size:13px; }
  .spinner{ width:16px; height:16px; border:2px solid #ddd; border-top-color:#888; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  /* Where embeds are measured before being placed in the grid. */
  #stage{ position:absolute; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
</style>

<div class="topbar" style="display:none;">
  <div class="count" id="count">Loading…</div>
  <div class="controls">
    <label class="muted">Gap <input id="gap" type="range" min="8" max="28" value="16"></label>
  </div>
</div>

<div class="masonry" id="grid" aria-live="polite"></div>
<div id="loader" class="loader"><span class="spinner"></span> Loading more…</div>
<div id="sentinel" style="height:1px;"></div>
<div id="notes" class="muted" style="margin-top:10px;"></div>
<div id="stage"></div>

<script>
(async () => {
  // Photos come from Instagram's official embed (instagram.com/p/<code>/embed/),
  // with the embed's header, like bar and "View more on Instagram" footer
  // clipped off so only the photo shows.
  //
  // Why not just use <img>: Instagram serves cross-origin-resource-policy:
  // same-origin on its CDN, so browsers refuse to render its images on another
  // site. It also 404s /media/?size=l for cross-site requests (it checks the
  // Sec-Fetch-Site header). The images.weserv.nl proxy used to sidestep both,
  // but Instagram now blocks that proxy's servers, which is why the grid
  // filled up with 404s. Embeds are the supported route and aren't rate
  // limited, since Instagram is serving its own frames.
  //
  // Geometry (measured, stable across widths):
  //   header  = 54px, footer = 154px
  //   Instagram posts {type:"MEASURE", details:{height}} to us via postMessage,
  //   so photo height = height - 208 at EMBED_W wide.
  const EMBED_W = 326;   // narrowest width the embed lays out cleanly
  const HEADER  = 54;
  const FOOTER  = 154;
  const MAX_CONCURRENT = 3;
  const MEASURE_TIMEOUT_MS = 15000;

  // --- Masonry sizing helpers (stable order) ---
  function resizeCard(card){
    const grid = document.getElementById('grid');
    const styles = window.getComputedStyle(grid);
    const rowHeight = parseFloat(styles.getPropertyValue('grid-auto-rows')) || 8;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 16;
    const h = card.getBoundingClientRect().height;
    const span = Math.ceil((h + gap) / (rowHeight + gap));
    card.style.gridRowEnd = 'span ' + span;
  }
  function wireMasonryObservers(card){
    // Cards are only added once their photo has loaded and been measured,
    // so size immediately and just watch for later changes.
    const ro = new ResizeObserver(() => resizeCard(card));
    ro.observe(card);
    resizeCard(card);
  }

  const el = id => document.getElementById(id);
  const COUNT = el('count'), GRID = el('grid'), GAP = el('gap'),
        NOTES = el('notes'), SENTINEL = el('sentinel'), LOADER = el('loader'),
        STAGE = el('stage');

  GAP.oninput = () =>
    document.documentElement.style.setProperty('--gap', GAP.value + 'px');

  // Load the file (must be served over http(s), not file://)
  const res = await fetch('posts_with_handles.txt', { cache:'no-store' });
  if (!res.ok) { COUNT.textContent = 'Could not load posts_with_handles.txt'; return; }
  const text = await res.text();

  // Split lines; ignore empties
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

  const items = [];
  let withHandle = 0, withoutHandle = 0;

  for (const rawLine of lines) {
    // Normalize spaces and @ variants
    const line = rawLine
      .replace(/ /g, ' ')          // non-breaking space -> space
      .replace(/[﹪＠]/g, '@')  // fullwidth/small @ -> normal @
      .replace(/\s+/g, ' ')
      .trim();

    // URL = first http(s) token
    const urlMatch = line.match(/https?:\/\/\S+/i);
    if (!urlMatch) { withoutHandle++; continue; }
    const url = urlMatch[0].split('?')[0].replace(/\/?$/, '/');

    // Handle = first @username anywhere on the line
    // (Instagram allows a-z, 0-9, dot, underscore; up to 30 chars)
    const hMatch = line.match(/@([A-Za-z0-9._]{1,30})/);
    const handle = hMatch ? hMatch[1] : '';

    if (handle) withHandle++; else withoutHandle++;

    // Embeds only exist for /p/ posts
    const pm = url.match(/instagram\.com\/(p)\/([^\/?#]+)/i);
    if (!pm) continue;

    items.push({ url, handle, code: pm[2] });
  }

  if (withoutHandle && withHandle === 0) {
    NOTES.innerHTML = '<span class="warn">All entries appear to be missing a recognizable "@handle" token on each line. Make sure each line looks like:<br><code>https://www.instagram.com/p/XXXX/ @username</code></span>';
  }

  // --- Listen for the height Instagram reports for each embed ---
  // Instagram posts MEASURE before the iframe's load event fires, so we can't
  // register the handler in onload — we look the frame up by its contentWindow
  // when the message actually arrives.
  const waiting = new Set(); // iframes currently being measured
  window.addEventListener('message', (e) => {
    let host;
    try { host = new URL(e.origin).hostname; } catch(_) { return; }
    if (!/(^|\.)instagram\.com$/.test(host)) return;
    let d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch(_) { return; } }
    if (!d || d.type !== 'MEASURE' || !d.details || !d.details.height) return;
    for (const frame of waiting){
      if (frame.contentWindow === e.source){
        if (frame._measured) frame._measured(d.details.height);
        break;
      }
    }
  });

  // Load one embed offscreen and wait for its measurement, so we never put an
  // empty box in the grid and always know the photo's true height.
  function measureEmbed(it){
    return new Promise((resolve) => {
      const frame = document.createElement('iframe');
      frame.setAttribute('scrolling', 'no');
      frame.setAttribute('loading', 'eager');
      frame.style.cssText = 'width:' + EMBED_W + 'px;height:1400px;border:0;';
      let settled = false;
      const finish = (photoH) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        waiting.delete(frame);
        resolve(photoH ? { frame, photoH } : null);
        if (!photoH) frame.remove();
      };
      const timer = setTimeout(() => finish(null), MEASURE_TIMEOUT_MS);
      frame._measured = (total) => {
        const photoH = total - HEADER - FOOTER;
        finish(photoH > 0 ? photoH : null);
      };
      frame.onerror = () => finish(null);
      waiting.add(frame);
      STAGE.appendChild(frame);
      frame.src = 'https://www.instagram.com/p/' + it.code + '/embed/';
    });
  }

  function buildCard(it, frame, photoH){
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    // Scale the 326px-wide embed down to whatever the column width is, and
    // shift it up by the header so the photo starts at the top of the tile.
    const setGeometry = () => {
      const w = thumb.clientWidth || GRID.clientWidth / 4;
      const scale = w / EMBED_W;
      frame.style.transform = 'scale(' + scale + ') translateY(' + (-HEADER) + 'px)';
      thumb.style.height = (photoH * scale) + 'px';
    };
    frame.style.width = EMBED_W + 'px';
    frame.style.height = (HEADER + photoH + FOOTER) + 'px';
    thumb.appendChild(frame);

    // Transparent link over the photo keeps the old click behaviour.
    const hit = document.createElement('a');
    hit.className = 'hit';
    hit.href = it.url;
    hit.target = '_blank';
    hit.rel = 'noopener';
    hit.setAttribute('aria-label', it.handle ? ('Open post by @' + it.handle) : 'Open post');
    thumb.appendChild(hit);
    card.appendChild(thumb);

    const meta = document.createElement('div');
    meta.className = 'meta';

    const handleEl = document.createElement('a');
    handleEl.textContent = it.handle ? '@' + it.handle : '@unknown';
    handleEl.href = it.handle
      ? 'https://www.instagram.com/' + it.handle + '/'
      : it.url;
    handleEl.target = '_blank';
    handleEl.rel = 'noopener';

    const open = document.createElement('a');
    open.textContent = 'Open post ↗';
    open.href = it.url;
    open.target = '_blank';
    open.rel = 'noopener';

    meta.appendChild(handleEl);
    meta.appendChild(open);
    card.appendChild(meta);

    card._setGeometry = setGeometry;
    return card;
  }

  // --- Scroll-gated loading ---
  // Nothing is requested until the sentinel (the bottom of what's already
  // loaded) reaches the viewport, and only a few embeds load at a time.
  let cursor = 0, activeLoads = 0, loadedCount = 0, nearBottom = false;

  function updateCount(){
    COUNT.textContent = `Loaded ${loadedCount} of ${items.length} posts`;
  }
  updateCount();

  function updateLoader(){
    LOADER.style.display = activeLoads > 0 ? 'flex' : 'none';
  }

  function startNext(){
    while (nearBottom && activeLoads < MAX_CONCURRENT && cursor < items.length){
      const it = items[cursor++];
      activeLoads++;
      updateLoader();
      measureEmbed(it).then((r) => {
        activeLoads--;
        if (r){
          const card = buildCard(it, r.frame, r.photoH);
          GRID.appendChild(card);
          card._setGeometry();
          wireMasonryObservers(card);
          loadedCount++;
          updateCount();
        }
        updateLoader();
        startNext();
      });
    }
  }

  const io = new IntersectionObserver((entries) => {
    nearBottom = entries[entries.length - 1].isIntersecting;
    if (nearBottom) startNext();
  }, { rootMargin: '600px 0px' });
  io.observe(SENTINEL);

  window.addEventListener('resize', () => {
    GRID.querySelectorAll('.card').forEach(c => {
      if (c._setGeometry) c._setGeometry();
      resizeCard(c);
    });
  });
})();
</script>
